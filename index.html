<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Thunder Fighters: a vertical pixel-art shoot'em up in the style of Strikers 1945. 5 stages, 4 planes, giant bosses.">
<title>Thunder Fighters</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="touchArea">
  <canvas id="screen" width="240" height="320"></canvas>
  <div id="loading">LOADING...</div>
  <div id="pad">
    <button class="tbtn" data-btn="bomb">BOMB<span>x3</span></button>
    <div class="mid">
      <button class="small" id="pauseBtn" aria-label="pause">II</button>
      <button class="small" id="fsBtn" aria-label="fullscreen">FULL</button>
    </div>
    <button class="tbtn" data-btn="super">SUPER<i></i></button>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/font.js"></script>
<script src="js/forge.js"></script>
<script src="js/sprites.js"></script>
<script src="js/bg.js"></script>
<script src="js/fx.js"></script>
<script src="js/music.js"></script>
<script src="js/audio.js"></script>
<script src="js/enemies.js"></script>
<script src="js/bosses.js"></script>
<script src="js/player.js"></script>
<script src="js/stages.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
