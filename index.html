<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Thunder Fighters: a vertical pixel-art shoot'em up in the style of Strikers 1945. 5 stages, 4 planes, giant bosses.">
<title>Thunder Fighters</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="touchArea">
  <canvas id="screen" width="240" height="320"></canvas>
  <div id="scan"></div>
  <div id="loading">LOADING...</div>
  <div id="pad">
    <div class="tbtn" data-btn="bomb"><canvas id="cBomb" width="40" height="46"></canvas></div>
    <div class="mid">
      <canvas id="lcd" width="96" height="30"></canvas>
      <div class="row">
        <button class="sbtn" id="pauseBtn" aria-label="pause"><canvas width="22" height="22"></canvas></button>
        <button class="sbtn" id="fsBtn" aria-label="fullscreen"><canvas width="22" height="22"></canvas></button>
      </div>
    </div>
    <div class="tbtn" data-btn="super"><canvas id="cSuper" width="40" height="46"></canvas></div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/font.js"></script>
<script src="js/forge.js"></script>
<script src="js/sprites.js"></script>
<script src="js/bg.js"></script>
<script src="js/world2.js"></script>
<script src="js/fx.js"></script>
<script src="js/music.js"></script>
<script src="js/audio.js"></script>
<script src="js/enemies.js"></script>
<script src="js/bosses.js"></script>
<script src="js/bosses2.js"></script>
<script src="js/player.js"></script>
<script src="js/stages.js"></script>
<script src="js/game.js"></script>
<script src="js/extras.js"></script>
<script src="js/mode7.js"></script>
<script src="js/touchui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
